<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Financeira Pessoal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <h1>💰 Gestão Financeira</h1>
        <!-- Botão para alternar Modo Claro / Escuro -->
        <button id="btn-tema" class="btn-tema">🌙 Modo Escuro</button>
      </div>
    </header>

    <!-- CARDS DE RESUMO -->
    <section class="cards-container">
      <div class="card card-receita">
        <h3>Receitas</h3>
        <p id="total-entradas">R$ 0,00</p>
      </div>
      <div class="card card-despesa">
        <h3>Despesas</h3>
        <p id="total-saidas">R$ 0,00</p>
      </div>
      <div class="card card-saldo">
        <h3>Saldo Total</h3>
        <p id="saldo-final">R$ 0,00</p>
      </div>
    </section>

    <!-- FORMULÁRIO DE LANÇAMENTO -->
    <section class="form-container">
      <h2>Novo Lançamento</h2>
      <form id="form-transacao">
        <div class="campo">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Salário, Mercado" required>
        </div>

        <div class="campo">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" step="0.01" placeholder="0.00" required>
        </div>

        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo" required>
            <option value="receita">Receita (+)</option>
            <option value="despesa">Despesa (-)</option>
          </select>
        </div>

        <button type="submit">Adicionar Transação</button>
      </form>
    </section>

    <!-- HISTÓRICO DE TRANSAÇÕES -->
    <section class="historico-container">
      <h2>Histórico de Transações</h2>
      <ul id="lista-transacoes">
        <!-- Itens inseridos via JavaScript em tempo real -->
      </ul>
    </section>
  </div>

  <!-- ==========================================================================
       WIDGET OFICIAL DO VLIBRAS (ACESSIBILIDADE EM LIBRAS)
       ========================================================================== -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <!-- Firebase App SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <!-- Firebase Firestore SDK (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Script Principal da Aplicação -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
